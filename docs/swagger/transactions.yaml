paths:
  # ─── MOBILE ─────────────────────────────────────────────
  /api/mobile/transactions:
    get:
      operationId: listMobileTransactions
      summary: Liste des transactions
      description: Récupère la liste paginée des transactions de l'utilisateur connecté avec filtrage optionnel.
      tags:
        - Transactions
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: type
          in: query
          description: Filtrer par type d'opération
          schema:
            type: string
            enum: [depot, transfert, transfert_inter, wallet_to_wallet]
        - name: status
          in: query
          description: Filtrer par statut
          schema:
            type: string
            enum: [pending, completed, failed]
        - $ref: '#/components/parameters/DeviceFingerprint'
        - $ref: '#/components/parameters/DeviceUid'
        - $ref: '#/components/parameters/DevicePlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/DeviceOsVersion'
      responses:
        '200':
          description: Liste paginée des transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactions'
              example:
                meta:
                  total: 45
                  perPage: 20
                  currentPage: 1
                  lastPage: 3
                data:
                  - reference: "TRF-20260308-A1B2C3"
                    type: "transfert"
                    amount: 5000
                    fees: 50
                    status: "completed"
                    providerCode: "ORANGE_CI"
                    senderPhone: "+22890001234"
                    receiverPhone: "+22890005678"
                    createdAt: "2026-03-08T14:22:00Z"
                  - reference: "DEP-20260307-D4E5F6"
                    type: "depot"
                    amount: 10000
                    fees: 100
                    status: "completed"
                    providerCode: "MTN_CI"
                    senderPhone: "+22890001234"
                    receiverPhone: null
                    createdAt: "2026-03-07T09:15:00Z"
        '401':
          description: Non autorisé

  /api/mobile/transactions/quotas:
    get:
      operationId: getTransactionQuotas
      summary: Quotas de transactions
      description: |
        Récupère les quotas de transactions de l'utilisateur basés sur son niveau KYC.
        Indique les limites par opération, journalières et mensuelles.
      tags:
        - Transactions
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceFingerprint'
        - $ref: '#/components/parameters/DeviceUid'
        - $ref: '#/components/parameters/DevicePlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/DeviceOsVersion'
      responses:
        '200':
          description: Quotas de l'utilisateur
          content:
            application/json:
              example:
                kycLevel: 1
                singleLimit: 50000
                dailyLimit: 200000
                monthlyLimit: 1000000
                balanceLimit: 500000
                dailyUsed: 15000
                monthlyUsed: 45000
        '401':
          description: Non autorisé

  /api/mobile/transactions/{reference}:
    get:
      operationId: getMobileTransaction
      summary: Détails d'une transaction
      description: Récupère les détails complets d'une transaction par sa référence unique.
      tags:
        - Transactions
      security:
        - BearerAuth: []
      parameters:
        - name: reference
          in: path
          required: true
          description: Référence unique de la transaction
          schema:
            type: string
          example: "TRF-20260308-A1B2C3"
        - $ref: '#/components/parameters/DeviceFingerprint'
        - $ref: '#/components/parameters/DeviceUid'
        - $ref: '#/components/parameters/DevicePlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/DeviceOsVersion'
      responses:
        '200':
          description: Détails de la transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
              example:
                reference: "TRF-20260308-A1B2C3"
                type: "transfert"
                amount: 5000
                fees: 50
                totalAmount: 5050
                status: "completed"
                providerCode: "ORANGE_CI"
                paymentMethodCode: "MOBILE_MONEY"
                senderPhone: "+22890001234"
                receiverPhone: "+22890005678"
                createdAt: "2026-03-08T14:22:00Z"
                updatedAt: "2026-03-08T14:22:35Z"
        '401':
          description: Non autorisé
        '404':
          description: Transaction non trouvée

  /api/mobile/transactions/stream/{reference}:
    get:
      operationId: streamTransaction
      summary: Suivi temps réel d'une transaction (SSE)
      description: |
        Ouvre un flux Server-Sent Events (SSE) pour suivre en temps réel
        le changement de statut d'une transaction en cours.
        Le flux se ferme automatiquement quand la transaction atteint un statut final.
      tags:
        - Transactions
      security:
        - BearerAuth: []
      parameters:
        - name: reference
          in: path
          required: true
          description: Référence de la transaction à suivre
          schema:
            type: string
          example: "TRF-20260308-A1B2C3"
        - $ref: '#/components/parameters/DeviceFingerprint'
        - $ref: '#/components/parameters/DeviceUid'
        - $ref: '#/components/parameters/DevicePlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/DeviceOsVersion'
      responses:
        '200':
          description: Flux SSE
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Flux SSE avec des événements au format :
                  `data: {"reference":"TRF-...","status":"completed","amount":5000}`
        '401':
          description: Non autorisé

  # ─── ADMIN ──────────────────────────────────────────────
  /api/admin/transactions:
    get:
      operationId: adminListTransactions
      summary: Liste de toutes les transactions
      description: Récupère la liste paginée de toutes les transactions du système avec filtrage.
      tags:
        - Admin - Transactions
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Recherche par référence, téléphone, etc.
          schema:
            type: string
      responses:
        '200':
          description: Liste paginée des transactions
        '401':
          description: Non autorisé

  /api/admin/transactions/stats:
    get:
      operationId: adminGetTransactionStats
      summary: Statistiques des transactions
      description: Récupère les statistiques globales (volumes, montants, répartition par type/statut).
      tags:
        - Admin - Transactions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              example:
                totalTransactions: 1250
                totalAmount: 45000000
                byType:
                  depot: 450
                  transfert: 620
                  transfert_inter: 80
                  wallet_to_wallet: 100
                byStatus:
                  completed: 1100
                  pending: 50
                  failed: 100
        '401':
          description: Non autorisé

  /api/admin/transactions/{reference}:
    get:
      operationId: adminGetTransaction
      summary: Détails d'une transaction (admin)
      description: Récupère les détails complets d'une transaction incluant les informations techniques.
      tags:
        - Admin - Transactions
      security:
        - BearerAuth: []
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Détails de la transaction
        '401':
          description: Non autorisé
        '404':
          description: Transaction non trouvée

  /api/admin/users/{id}/transactions:
    get:
      operationId: adminGetUserTransactions
      summary: Transactions d'un utilisateur
      description: Récupère l'historique des transactions d'un utilisateur spécifique.
      tags:
        - Admin - Transactions
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant de l'utilisateur
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Transactions de l'utilisateur
        '401':
          description: Non autorisé

  /api/admin/users/{id}/transactions/stats:
    get:
      operationId: adminGetUserTransactionStats
      summary: Statistiques des transactions d'un utilisateur
      description: Récupère les statistiques de transactions d'un utilisateur spécifique.
      tags:
        - Admin - Transactions
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Statistiques de l'utilisateur
        '401':
          description: Non autorisé

components:
  schemas:
    TransactionDetail:
      type: object
      properties:
        reference:
          type: string
          description: Référence unique de la transaction
        type:
          type: string
          enum: [depot, transfert, transfert_inter, wallet_to_wallet]
        amount:
          type: number
        fees:
          type: number
        totalAmount:
          type: number
        status:
          type: string
          enum: [pending, completed, failed]
        providerCode:
          type: string
          nullable: true
        paymentMethodCode:
          type: string
          nullable: true
        senderPhone:
          type: string
        receiverPhone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginatedTransactions:
      type: object
      properties:
        meta:
          type: object
          properties:
            total:
              type: integer
            perPage:
              type: integer
            currentPage:
              type: integer
            lastPage:
              type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransactionDetail'
