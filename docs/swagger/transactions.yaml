paths:
  # ─── MOBILE ─────────────────────────────────────────────
  /api/mobile/transactions:
    get:
      operationId: listMobileTransactions
      summary: Liste des transactions
      description: |
        Récupère la liste paginée des transactions de l'utilisateur connecté. La pagination se
        fait via le paramètre `page`.
      tags:
        - Transactions
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Numéro de page (pagination).
          schema:
            type: integer
            default: 1
        - $ref: '#/components/parameters/DeviceFingerprint'
        - $ref: '#/components/parameters/DeviceUid'
        - $ref: '#/components/parameters/DevicePlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/DeviceOsVersion'
      responses:
        '200':
          description: Liste paginée des transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactions'
              example:
                data:
                  - transactionId: "aig_tx_4b7e1d"
                    reference: "TRF-20260308-A1B2C3"
                    amount: 5000
                    fees: 50
                    totalAmount: 5050
                    operationType: "transfert"
                    status: "success"
                    balanceAfter: 12000
                    direction: "debit"
                    dateTransaction: "2026-03-08T14:22:00.000Z"
                    payment:
                      - paymentMethod: "mobile-money"
                        status: "success"
                        step: "transfert_confirmed"
                        paymentDetails: { operator: "orange", phone: "2250708123456", user: "Awa Traoré" }
                        error: null
                    display:
                      kind: "external_transfer"
                      scope: "external"
                      flow: "out"
                      counterparty:
                        { nature: "external", name: null, phone: "2250708123456", operator: "orange" }
                meta:
                  total: 45
                  currentPage: 1
                  firstPage: 1
                  lastPage: 3
                  perPage: 16
        '401':
          description: Non autorisé

  /api/mobile/transactions/quotas:
    get:
      operationId: getTransactionQuotas
      summary: Quotas de transactions
      description: |
        Récupère les quotas de transactions de l'utilisateur basés sur son niveau KYC.
        Indique les limites par opération, journalières et mensuelles.
      tags:
        - Transactions
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceFingerprint'
        - $ref: '#/components/parameters/DeviceUid'
        - $ref: '#/components/parameters/DevicePlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/DeviceOsVersion'
      responses:
        '200':
          description: Quotas de l'utilisateur
          content:
            application/json:
              example:
                kycLevel: 1
                singleLimit: 50000
                dailyLimit: 200000
                monthlyLimit: 1000000
                balanceLimit: 500000
                dailyUsed: 15000
                monthlyUsed: 45000
        '401':
          description: Non autorisé

  /api/mobile/transactions/{reference}:
    get:
      operationId: getMobileTransaction
      summary: Détails d'une transaction
      description: Récupère les détails complets d'une transaction par sa référence unique.
      tags:
        - Transactions
      security:
        - BearerAuth: []
      parameters:
        - name: reference
          in: path
          required: true
          description: Référence unique de la transaction
          schema:
            type: string
          example: "TRF-20260308-A1B2C3"
        - $ref: '#/components/parameters/DeviceFingerprint'
        - $ref: '#/components/parameters/DeviceUid'
        - $ref: '#/components/parameters/DevicePlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/DeviceOsVersion'
      responses:
        '200':
          description: Détails de la transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
              example:
                transactionId: "aig_tx_4b7e1d"
                reference: "TRF-20260308-A1B2C3"
                amount: 5000
                fees: 50
                totalAmount: 5050
                operationType: "transfert"
                status: "success"
                balanceAfter: 12000
                direction: "debit"
                dateTransaction: "2026-03-08T14:22:00.000Z"
                payment:
                  - paymentMethod: "mobile-money"
                    status: "success"
                    step: "transfert_confirmed"
                    paymentDetails: { operator: "orange", phone: "2250708123456", user: "Awa Traoré" }
                    error: null
                display:
                  kind: "external_transfer"
                  scope: "external"
                  flow: "out"
                  counterparty:
                    { nature: "external", name: null, phone: "2250708123456", operator: "orange" }
        '401':
          description: Non autorisé
        '404':
          description: Transaction non trouvée

  /api/mobile/transactions/stream/{reference}:
    get:
      operationId: streamTransaction
      summary: Suivi temps réel d'une transaction (SSE)
      description: |
        Ouvre un flux Server-Sent Events (SSE) pour suivre en temps réel
        le changement de statut d'une transaction en cours.
        Le flux se ferme automatiquement quand la transaction atteint un statut final.
      tags:
        - Transactions
      security:
        - BearerAuth: []
      parameters:
        - name: reference
          in: path
          required: true
          description: Référence de la transaction à suivre
          schema:
            type: string
          example: "TRF-20260308-A1B2C3"
        - $ref: '#/components/parameters/DeviceFingerprint'
        - $ref: '#/components/parameters/DeviceUid'
        - $ref: '#/components/parameters/DevicePlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/DeviceOsVersion'
      responses:
        '200':
          description: Flux SSE
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Flux SSE. Un événement `data:` est émis avec l'état courant de la transaction :
                  `data: {"reference":"aig_tx_4b7e1d","status":"success", ...}`
                  (le contrôleur émet un seul événement avec le détail de la transaction).
        '401':
          description: Non autorisé

  # ─── ADMIN ──────────────────────────────────────────────
  /api/admin/transactions:
    get:
      operationId: adminListTransactions
      summary: Liste de toutes les transactions
      description: Récupère la liste paginée de toutes les transactions du système avec filtrage.
      tags:
        - Admin - Transactions
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Recherche par référence, téléphone, etc.
          schema:
            type: string
      responses:
        '200':
          description: Liste paginée des transactions
        '401':
          description: Non autorisé

  /api/admin/transactions/stats:
    get:
      operationId: adminGetTransactionStats
      summary: Statistiques des transactions
      description: Récupère les statistiques globales (volumes, montants, répartition par type/statut).
      tags:
        - Admin - Transactions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              example:
                totalTransactions: 1250
                totalAmount: 45000000
                byType:
                  depot: 450
                  transfert: 620
                  transfert_inter: 80
                  wallet_to_wallet: 100
                byStatus:
                  completed: 1100
                  pending: 50
                  failed: 100
        '401':
          description: Non autorisé

  /api/admin/transactions/{reference}:
    get:
      operationId: adminGetTransaction
      summary: Détails d'une transaction (admin)
      description: Récupère les détails complets d'une transaction incluant les informations techniques.
      tags:
        - Admin - Transactions
      security:
        - BearerAuth: []
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Détails de la transaction
        '401':
          description: Non autorisé
        '404':
          description: Transaction non trouvée

  /api/admin/users/{id}/transactions:
    get:
      operationId: adminGetUserTransactions
      summary: Transactions d'un utilisateur
      description: Récupère l'historique des transactions d'un utilisateur spécifique.
      tags:
        - Admin - Transactions
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant de l'utilisateur
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Transactions de l'utilisateur
        '401':
          description: Non autorisé

  /api/admin/users/{id}/transactions/stats:
    get:
      operationId: adminGetUserTransactionStats
      summary: Statistiques des transactions d'un utilisateur
      description: Récupère les statistiques de transactions d'un utilisateur spécifique.
      tags:
        - Admin - Transactions
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Statistiques de l'utilisateur
        '401':
          description: Non autorisé

components:
  schemas:
    TransactionPayment:
      type: object
      description: Étape de paiement associée à la transaction (mobile).
      required: [paymentMethod, status, step, paymentDetails]
      properties:
        paymentMethod:
          type: string
          example: "mobile-money"
        status:
          type: string
          example: "success"
        step:
          type: string
          enum:
            - wallet_to_wallet
            - deposit_init
            - deposit_pending
            - deposit_confirmed
            - deposit_failed
            - transfert_init
            - transfert_pending
            - transfert_confirmed
            - transfert_failed
          example: "transfert_confirmed"
        paymentDetails:
          type: object
          required: [operator, phone, user]
          properties:
            operator:
              type: string
              example: "orange"
            phone:
              type: string
              example: "2250708123456"
            user:
              type: string
              example: "Awa Traoré"
        error:
          type: object
          nullable: true
          description: Présent (non `null`) uniquement en cas d'échec.
          properties:
            category:
              type: string
              nullable: true
            message:
              type: string
              nullable: true

    TransactionDetail:
      type: object
      required:
        - transactionId
        - reference
        - amount
        - fees
        - totalAmount
        - operationType
        - status
        - balanceAfter
        - direction
        - dateTransaction
        - payment
        - display
      properties:
        transactionId:
          type: string
          description: Identifiant public de la transaction.
          example: "aig_tx_4b7e1d"
        reference:
          type: string
          description: Référence unique de la transaction.
          example: "TRF-20260308-A1B2C3"
        amount:
          type: number
          example: 5000
        fees:
          type: number
          example: 50
        totalAmount:
          type: number
          example: 5050
        operationType:
          type: string
          description: Type d'opération (ex. `depot`, `transfert`, `wallet_to_wallet`).
          example: "transfert"
        status:
          type: string
          example: "success"
        balanceAfter:
          type: number
          description: Solde du portefeuille après l'opération.
          example: 12000
        direction:
          type: string
          enum: [debit, credit, external]
          example: "debit"
        dateTransaction:
          type: string
          format: date-time
          example: "2026-03-08T14:22:00.000Z"
        payment:
          type: array
          items:
            $ref: '#/components/schemas/TransactionPayment'
        display:
          $ref: '#/components/schemas/TransactionDisplay'

    TransactionCounterparty:
      type: object
      description: >
        Contrepartie du leg (**privacy-first**). Pour un `user` ou un opérateur `external`, seul
        `{ phone, operator }` est exposé — **jamais** le nom : l'app le résout en **contact local**
        via le carnet du porteur. Seul un **marchand** (identité commerciale) porte un `name`.
      required: [nature, name, phone, operator]
      properties:
        nature:
          type: string
          enum: [user, merchant, external]
          description: Nature de la contrepartie.
          example: "user"
        name:
          type: string
          nullable: true
          description: Nom commercial — **présent uniquement** pour un marchand (sinon `null`).
          example: null
        phone:
          type: string
          nullable: true
          description: Numéro de la contrepartie (user/external) — à résoudre en contact côté app.
          example: "2250708123456"
        operator:
          type: string
          nullable: true
          description: Opérateur (`aiglesend` pour un mouvement interne ; `wave`/`orange`… en externe).
          example: "aiglesend"

    TransactionDisplay:
      type: object
      description: >
        Classification d'affichage **dérivée** (taxonomie 2026-07), partagée mobile + admin. Lève
        l'ambiguïté historique de `operationType` : le libellé humain et le signe sont composés côté
        client à partir de `kind` + `flow` + `counterparty`.
      required: [kind, scope, flow, counterparty]
      properties:
        kind:
          type: string
          enum:
            - deposit
            - external_transfer
            - inter_network
            - merchant_collection
            - p2p_transfer
            - merchant_payment
            - refund
            - unknown
          description: >
            Type métier affiché. `p2p_transfer` = transfert entre utilisateurs ; `merchant_payment`
            = paiement chez un marchand ; `merchant_collection` = encaissement marchand (checkout,
            interne ou externe).
          example: "p2p_transfer"
        scope:
          type: string
          enum: [internal, external]
          description: L'argent reste dans aigle (`internal`) ou franchit un opérateur (`external`).
          example: "internal"
        flow:
          type: string
          enum: [in, out, neutral]
          description: >
            Sens vis-à-vis du compte du leg : `in` (crédit, +), `out` (débit, −), `neutral` (jambe
            de transit d'un inter-réseau).
          example: "out"
        counterparty:
          $ref: '#/components/schemas/TransactionCounterparty'

    PaginatedTransactions:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransactionDetail'
        meta:
          type: object
          required: [total, currentPage, firstPage, lastPage, perPage]
          properties:
            total:
              type: integer
              example: 45
            currentPage:
              type: integer
              example: 1
            firstPage:
              type: integer
              example: 1
            lastPage:
              type: integer
              example: 3
            perPage:
              type: integer
              description: Taille de page fixe (16).
              example: 16
