paths:
  /api/mobile/operations/deposit:
    post:
      operationId: createDeposit
      summary: Effectuer un dépôt (cash-in)
      description: |
        Initie un **dépôt** depuis un compte mobile money vers le portefeuille de l'utilisateur.

        **Traitement asynchrone** : la réponse renvoie immédiatement `status: pending`. Le crédit
        définitif (`success` / `failed`) arrive via un **webhook opérateur** (voir la ressource
        Webhooks). Avec un prestataire synchrone (ex. Wave), la réponse peut contenir un
        `redirectUrl` que le client doit ouvrir pour autoriser le paiement.

        Nécessite une authentification (jeton Bearer), les en-têtes d'appareil et l'en-tête
        d'idempotence `X-Idempotency-Key` (**obligatoire**). Aucun code PIN requis.
      tags:
        - Opérations
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceFingerprint'
        - $ref: '#/components/parameters/DeviceUid'
        - $ref: '#/components/parameters/DevicePlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/DeviceOsVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
            example:
              amount: 5000
              service_type: "deposit"
              provider_code: "moov"
              provider_id: 3
              payment_method_code: "mobile-money"
              payment_method_id: 1
              phone: "0708123456"
      responses:
        '200':
          description: Dépôt initié (en attente de règlement opérateur)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
              examples:
                pending:
                  summary: Prestataire asynchrone
                  value:
                    message: "transaction initiated"
                    data:
                      transactionReference: "aig_tx_9f3a2c"
                      status: "pending"
                redirect:
                  summary: Prestataire synchrone (ex. Wave)
                  value:
                    message: "transaction initiated"
                    data:
                      transactionReference: "aig_tx_9f3a2c"
                      status: "pending"
                      redirectUrl: "https://pay.wave.com/c/cos-1a2b3c"
                      type: "redirect"
        '400':
          $ref: '#/components/responses/OperationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DuplicateTransaction'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/mobile/operations/transfert:
    post:
      operationId: createTransfer
      summary: Effectuer un transfert (cash-out)
      description: |
        Initie un **transfert** du portefeuille vers un compte mobile money. Le portefeuille est
        débité immédiatement (réservation), puis `status: pending` ; `success` / `failed`
        arrivent par webhook. En cas d'échec, le débit est remboursé (`refunded`). **Code PIN
        requis.**

        **Routage selon `payment_method_code`** :
          - `mobile-money` → transfert externe vers l'opérateur (décrit ici, réponse
            `data.transactionReference`).
          - `wallet` → redirigé en interne vers `wallet-to-wallet` (par téléphone) ; la réponse
            suit alors le format wallet-to-wallet (`data.reference`).
          - toute autre valeur → `400` « Payment method not supported ».

        Nécessite une authentification (jeton Bearer), les en-têtes d'appareil et l'en-tête
        d'idempotence `X-Idempotency-Key`.
      tags:
        - Opérations
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceFingerprint'
        - $ref: '#/components/parameters/DeviceUid'
        - $ref: '#/components/parameters/DevicePlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/DeviceOsVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
            example:
              amount: 5000
              service_type: "transfert"
              provider_code: "orange"
              provider_id: 2
              payment_method_code: "mobile-money"
              payment_method_id: 1
              phone: "0709876543"
              pincode: "12345"
              include_fees: false
      responses:
        '200':
          description: Transfert initié (en attente de règlement opérateur)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
              example:
                message: "transfert initié"
                data:
                  transactionReference: "aig_tx_4b7e1d"
                  status: "pending"
        '400':
          $ref: '#/components/responses/OperationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DuplicateTransaction'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/mobile/operations/transfert-inter:
    post:
      operationId: createInterTransfer
      summary: Effectuer un transfert inter-réseaux (en deux étapes)
      description: |
        Transfert **inter-réseaux** (opérateur A → opérateur B) via aiglesend, en **deux étapes** :
        un débit depuis le compte émetteur (`debitaire`), puis un versement vers le bénéficiaire
        (`beneficiaire`). Renvoie `status: pending` ; la seconde étape est déclenchée à la
        confirmation de règlement de la première. Un `redirectUrl` peut apparaître si la première
        étape passe par un prestataire synchrone.

        **Code PIN** : cette opération n'exige pas de `pincode` (contrairement au transfert
        simple). S'il est fourni, `debitaire.pincode` est pris en compte.

        Nécessite une authentification (jeton Bearer), les en-têtes d'appareil et l'en-tête
        d'idempotence `X-Idempotency-Key`.
      tags:
        - Opérations
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceFingerprint'
        - $ref: '#/components/parameters/DeviceUid'
        - $ref: '#/components/parameters/DevicePlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/DeviceOsVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterTransferRequest'
            example:
              amount: 5000
              service_type: "inter_reseau"
              include_fees: false
              debitaire:
                phone: "0708123456"
                provider_code: "moov"
                provider_id: 3
                payment_method_code: "mobile-money"
                payment_method_id: 1
              beneficiaire:
                phone: "0709876543"
                provider_code: "orange"
                provider_id: 2
                payment_method_code: "mobile-money"
                payment_method_id: 1
      responses:
        '200':
          description: Transfert inter-réseaux initié (première étape en attente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
              example:
                message: "Initialisation du dépot inter effectuée"
                data:
                  transactionReference: "aig_tx_71c9a4"
                  status: "pending"
        '400':
          $ref: '#/components/responses/OperationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DuplicateTransaction'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/mobile/operations/wallet-to-wallet:
    post:
      operationId: createWalletToWallet
      summary: Transfert wallet-à-wallet (interne, instantané)
      description: |
        Transfert **interne instantané** entre deux portefeuilles aiglesend. Pas d'opérateur
        externe, **pas de webhook** : le statut est **définitif dans la réponse** (`success`).
        Le bénéficiaire est identifié par `recipient_phone` (mode téléphone) ou par `token`
        (mode QR — si `token` est fourni). **Code PIN requis.**

        ⚠️ La réponse renvoie le champ sous le nom **`reference`** (et non `transactionReference`
        comme les autres opérations).

        Nécessite une authentification (jeton Bearer), les en-têtes d'appareil et l'en-tête
        d'idempotence `X-Idempotency-Key`.
      tags:
        - Opérations
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceFingerprint'
        - $ref: '#/components/parameters/DeviceUid'
        - $ref: '#/components/parameters/DevicePlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/DeviceOsVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletToWalletRequest'
            example:
              recipient_phone: "0709876543"
              amount: 5000
              pincode: "12345"
      responses:
        '200':
          description: Transfert wallet-à-wallet effectué (définitif)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransferResponse'
              example:
                message: "Transfert wallet-to-wallet effectué avec succès"
                data:
                  reference: "aig_tx_a1b2c3"
                  status: "success"
        '400':
          $ref: '#/components/responses/OperationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DuplicateTransaction'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/mobile/operations/pay-merchant:
    post:
      operationId: payMerchant
      summary: Paiement marchand depuis le wallet (interne, instantané)
      description: |
        Paiement d'un **marchand** depuis le portefeuille aiglesend, en scannant son **QR marchand**.
        Mouvement **interne instantané** (statut définitif dans la réponse), **sans frais**. Le
        `code` provient du QR (alias payable) ; le compte marchand est résolu côté serveur et n'est
        jamais exposé. **Code PIN requis** (débit du wallet).

        Le marchand est soumis aux **limites de réception** de son niveau (KYB) : un paiement qui les
        dépasserait est refusé (`403`). La description du débit porte le **nom du marchand**.

        Nécessite une authentification (jeton Bearer), les en-têtes d'appareil et l'en-tête
        d'idempotence `X-Idempotency-Key`.
      tags:
        - Opérations
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceFingerprint'
        - $ref: '#/components/parameters/DeviceUid'
        - $ref: '#/components/parameters/DevicePlatform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/DeviceOsVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayMerchantRequest'
            example:
              code: "aig_mrc_7f3a2c"
              amount: 5000
              pincode: "12345"
      responses:
        '200':
          description: Paiement marchand effectué (définitif)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayMerchantResponse'
              example:
                message: "Paiement marchand effectué avec succès"
                data:
                  reference: "aig_tx_a1b2c3"
                  status: "success"
                  merchant: "Boutique Ali"
        '400':
          $ref: '#/components/responses/OperationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Marchand inactif, compte bloqué, ou **limite de réception du marchand dépassée**. Le code
            `E_RECIPIENT_LIMIT_EXCEEDED` signale que c'est le **destinataire** (le marchand) qui ne
            peut pas recevoir ce montant — le client affiche un message marchand, sans blâmer le payeur.
          content:
            application/json:
              examples:
                merchantInactive:
                  value:
                    code: E_MERCHANT_INACTIVE
                    message: Ce marchand n'accepte pas les paiements pour le moment.
                recipientLimit:
                  value:
                    code: E_RECIPIENT_LIMIT_EXCEEDED
                    message: Le destinataire ne peut pas recevoir ce montant pour le moment.
        '404':
          description: Marchand introuvable pour ce code
          content:
            application/json:
              example:
                code: E_MERCHANT_NOT_FOUND
                message: Marchand introuvable pour ce code.
        '409':
          $ref: '#/components/responses/DuplicateTransaction'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  parameters:
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      description: |
        Clé d'idempotence unique par opération métier (UUID v4 recommandé). Rejouer la même clé
        renvoie la réponse d'origine ; une clé encore en cours de traitement renvoie `409`.
        Header absent → `400`.
      schema:
        type: string
        format: uuid
      example: "7f3a2c10-9e11-4b2a-8c3d-1a2b3c4d5e6f"

  schemas:
    OperationStatus:
      type: string
      description: |
        Cycle de vie : `pending` → `success` | `failed` → `refunded` (remboursement du débit
        après échec d'un transfert).
      enum: [pending, success, failed, refunded]

    OperationResponseData:
      type: object
      properties:
        transactionReference:
          type: string
          description: Référence de la transaction (identifiant généré par le serveur, à conserver tel quel).
        status:
          $ref: '#/components/schemas/OperationStatus'
        redirectUrl:
          type: string
          description: Optionnel — URL à ouvrir pour les providers synchrones (ex. Wave).
        type:
          type: string
          description: Optionnel — type de règlement du prestataire, si fourni.

    OperationResponse:
      type: object
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/OperationResponseData'

    WalletTransferResponse:
      type: object
      description: Réponse spécifique à wallet-to-wallet (champ `reference`, statut définitif).
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            reference:
              type: string
              description: Référence de la transaction (identifiant serveur, à conserver tel quel).
            status:
              $ref: '#/components/schemas/OperationStatus'

    DepositRequest:
      type: object
      required:
        - amount
        - service_type
        - provider_id
        - provider_code
        - payment_method_code
        - payment_method_id
        - phone
      properties:
        amount:
          type: number
          minimum: 1
          description: Montant du dépôt (entier, XOF).
        service_type:
          type: string
          description: Code du type de service (doit exister dans `service_types.code`).
        provider_code:
          type: string
          description: Code opérateur source (doit exister dans `providers.code`), ex. `moov`.
        provider_id:
          type: integer
          description: Id opérateur source (doit exister dans `providers.id`).
        payment_method_code:
          type: string
          description: Code du moyen de paiement (doit exister dans `payment_methods.code`).
        payment_method_id:
          type: integer
          description: Id du moyen de paiement (doit exister dans `payment_methods.id`).
        phone:
          type: string
          description: Numéro mobile money débité (compte opérateur du client).

    TransferRequest:
      type: object
      required:
        - amount
        - service_type
        - provider_id
        - provider_code
        - payment_method_code
        - payment_method_id
        - phone
        - pincode
      properties:
        amount:
          type: number
          minimum: 1
          description: Montant du transfert (entier, XOF).
        service_type:
          type: string
          description: Code du type de service (doit exister dans `service_types.code`).
        provider_code:
          type: string
          description: Code opérateur bénéficiaire (doit exister dans `providers.code`).
        provider_id:
          type: integer
          description: Id opérateur bénéficiaire (doit exister dans `providers.id`).
        payment_method_code:
          type: string
          description: '`mobile-money` (externe) ou `wallet` (redirige vers wallet-to-wallet).'
        payment_method_id:
          type: integer
          description: Id du moyen de paiement (doit exister dans `payment_methods.id`).
        phone:
          type: string
          description: Numéro du bénéficiaire.
        pincode:
          type: string
          minLength: 5
          maxLength: 5
          description: Code PIN de l'utilisateur (exactement 5 caractères).
        include_fees:
          type: boolean
          description: Si `true`, les frais sont inclus dans le montant.

    InterTransferRequest:
      type: object
      required:
        - amount
        - service_type
        - debitaire
        - beneficiaire
      properties:
        amount:
          type: number
          minimum: 1
          description: Montant (entier, XOF).
        service_type:
          type: string
          description: Code du type de service (doit exister dans `service_types.code`), ex. `inter_reseau`.
        include_fees:
          type: boolean
          description: Inclure les frais dans le montant.
        debitaire:
          $ref: '#/components/schemas/InterTransferLeg'
        beneficiaire:
          $ref: '#/components/schemas/InterTransferLeg'

    InterTransferLeg:
      type: object
      required:
        - phone
        - provider_code
        - provider_id
        - payment_method_code
        - payment_method_id
      properties:
        phone:
          type: string
        provider_code:
          type: string
          description: Doit exister dans `providers.code`.
        provider_id:
          type: integer
          description: Doit exister dans `providers.id`.
        payment_method_code:
          type: string
          description: Doit exister dans `payment_methods.code`.
        payment_method_id:
          type: integer
          description: Doit exister dans `payment_methods.id`.

    WalletToWalletRequest:
      type: object
      required:
        - amount
        - pincode
      properties:
        recipient_phone:
          type: string
          description: Numéro du bénéficiaire (mode téléphone — alternatif à `token`).
        token:
          type: string
          description: Jeton QR du bénéficiaire (mode QR — si présent, prioritaire).
        amount:
          type: number
          minimum: 1
          description: Montant (entier ≥ 1, XOF).
        pincode:
          type: string
          minLength: 5
          maxLength: 5
          description: Code PIN de l'expéditeur (exactement 5 caractères).

    PayMerchantRequest:
      type: object
      required:
        - code
        - amount
        - pincode
      properties:
        code:
          type: string
          description: Code du marchand extrait du QR (alias payable).
          example: aig_mrc_7f3a2c
        amount:
          type: number
          minimum: 1
          description: Montant (entier ≥ 1, XOF).
          example: 5000
        pincode:
          type: string
          minLength: 5
          maxLength: 5
          description: Code PIN du payeur (exactement 5 caractères).
          example: "12345"

    PayMerchantResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
          example: Paiement marchand effectué avec succès
        data:
          type: object
          required:
            - reference
            - status
            - merchant
          properties:
            reference:
              type: string
              description: Référence de la transaction (débit du payeur).
              example: aig_tx_a1b2c3
            status:
              type: string
              example: success
            merchant:
              type: string
              description: Nom du marchand crédité (résolu depuis le QR).
              example: Boutique Ali

  responses:
    OperationBadRequest:
      description: |
        Requête rejetée : en-tête d'appareil manquant (`MISSING_DEVICE_HEADERS`), `X-Idempotency-Key`
        absent, méthode de paiement non supportée, ou refus métier (solde insuffisant, plafond…).
      content:
        application/json:
          examples:
            missingDevice:
              value:
                message: "Missing required device headers: X-Device-Fingerprint, X-Device-Uid"
                status: 400
                code: "MISSING_DEVICE_HEADERS"
            missingIdempotency:
              value:
                message: "X-Idempotency-Key header is missing."
            unsupportedMethod:
              value:
                message: "Payment method not supported"
    Unauthorized:
      description: Token absent ou invalide.
      content:
        application/json:
          example:
            message: "Unauthorized"
            status: 401
    DuplicateTransaction:
      description: Idempotence — transaction déjà en cours ou déjà traitée.
      content:
        application/json:
          example:
            message: "Cette transaction est déjà en cours de traitement."
            code: "E_DUPLICATE_TRANSACTION"
    ValidationError:
      description: Échec de validation (tableau de messages Vine).
      content:
        application/json:
          example:
            - message: "The provider_code field must be defined"
              rule: "required"
              field: "provider_code"