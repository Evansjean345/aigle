paths:
  /api/provider-webhooks/hub2/payments/success:
    post:
      operationId: hub2PaymentSuccessWebhook
      summary: Webhook Hub2 — paiement réussi
      description: |
        **Entrant, appelé par Hub2** (pas par le client mobile). Notifie le règlement réussi d'un
        paiement (checkout) et déclenche la mise à jour de la transaction correspondante.

        **Signature** : le serveur recalcule `HMAC-SHA256(rawBody, secret)` en hexadécimal et le
        compare, en temps constant, à `s1` puis `s0` de l'en-tête **`hub2-signature`** (fenêtre de
        rotation du secret). Secret manquant, corps ou en-tête absent, ou signature invalide →
        `401`.

        **Réponse** : toujours `200` avec un corps `{}`, même en cas de type non supporté ou de
        données invalides (la réception est acquittée pour éviter les renvois Hub2 ; les échecs de
        traitement sont journalisés). Aucune authentification par jeton (l'authenticité est
        établie par la signature).
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/Hub2Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hub2WebhookEvent'
            example:
              type: "payment_intent.succeeded"
              data:
                id: "pi_hub2_88f21a"
                purchaseReference: "aig_tx_9f3a2c"
      responses:
        '200':
          $ref: '#/components/responses/WebhookAck'
        '401':
          $ref: '#/components/responses/WebhookSignatureError'

  /api/provider-webhooks/hub2/payments/failed:
    post:
      operationId: hub2PaymentFailedWebhook
      summary: Webhook Hub2 — paiement échoué
      description: |
        **Entrant, appelé par Hub2.** Notifie l'échec d'un paiement (checkout). Le code d'échec
        natif (`data.lastPaymentFailure.code` / `data.failureCause.code` / `data.code`) est
        normalisé en un code d'erreur standard. Signature vérifiée. Réponse toujours `200 {}`.
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/Hub2Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hub2WebhookEvent'
            example:
              type: "payment_intent.payment_failed"
              data:
                id: "pi_hub2_88f21a"
                purchaseReference: "aig_tx_9f3a2c"
                lastPaymentFailure:
                  code: "insufficient_funds"
                  message: "Solde insuffisant"
      responses:
        '200':
          $ref: '#/components/responses/WebhookAck'
        '401':
          $ref: '#/components/responses/WebhookSignatureError'

  /api/provider-webhooks/hub2/transfers/success:
    post:
      operationId: hub2TransferSuccessWebhook
      summary: Webhook Hub2 — transfert (payout) réussi
      description: |
        **Entrant, appelé par Hub2.** Notifie le règlement réussi d'un transfert (payout). La
        référence est lue dans `data.reference`. Signature vérifiée (route `transfers.success`).
        Réponse toujours `200 {}`.
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/Hub2Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hub2WebhookEvent'
            example:
              type: "transfer.succeeded"
              data:
                id: "tr_hub2_4b7e1d"
                reference: "aig_tx_4b7e1d"
      responses:
        '200':
          $ref: '#/components/responses/WebhookAck'
        '401':
          $ref: '#/components/responses/WebhookSignatureError'

  /api/provider-webhooks/hub2/transfers/failed:
    post:
      operationId: hub2TransferFailedWebhook
      summary: Webhook Hub2 — transfert (payout) échoué
      description: |
        **Entrant, appelé par Hub2.** Notifie l'échec d'un transfert (payout) ; déclenche le
        remboursement du débit (`refunded`) le cas échéant. Signature vérifiée (route
        `transfers.failed`). Réponse toujours `200 {}`.
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/Hub2Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hub2WebhookEvent'
            example:
              type: "transfer.failed"
              data:
                id: "tr_hub2_4b7e1d"
                reference: "aig_tx_4b7e1d"
                failureCause:
                  code: "provider_unavailable"
                  message: "Opérateur injoignable"
      responses:
        '200':
          $ref: '#/components/responses/WebhookAck'
        '401':
          $ref: '#/components/responses/WebhookSignatureError'

  /api/provider-webhooks/wave:
    post:
      operationId: waveWebhook
      summary: Webhook Wave
      description: |
        **Entrant, appelé par Wave.** Règle les opérations réalisées via Wave. Le schéma de la
        charge utile et la vérification de signature Wave seront précisés ultérieurement. Réponse
        `200` attendue.
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Charge utile Wave.
      responses:
        '200':
          $ref: '#/components/responses/WebhookAck'

components:
  parameters:
    Hub2Signature:
      name: hub2-signature
      in: header
      required: true
      description: |
        Signature HMAC-SHA256 du corps brut, encodée en hex. Contient une ou deux signatures :
        `s1` (secret courant) et `s0` (ancien secret, fenêtre de rotation). Ex.
        `s1=3a7f...e2, s0=91bc...d4`.
      schema:
        type: string
      example: "s1=3a7f0c9e2b1d..., s0=91bcd4e5f6a7..."

  schemas:
    Hub2WebhookEvent:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          description: Type d'événement Hub2.
          enum:
            - payment_intent.succeeded
            - payment_intent.payment_failed
            - transfer.succeeded
            - transfer.failed
        data:
          type: object
          description: |
            Charge utile de l'événement. Pour les checkouts, la référence aiglesend est dans
            `purchaseReference` ; pour les transferts, dans `reference`. `data.id` = référence
            côté prestataire. En cas d'échec, `lastPaymentFailure`/`failureCause`/`code` portent le
            code d'erreur natif du prestataire, normalisé en un code d'erreur standard.
          properties:
            id:
              type: string
              description: Référence côté prestataire Hub2.
            purchaseReference:
              type: string
              description: Référence aiglesend (événements checkout/payment_intent).
            reference:
              type: string
              description: Référence aiglesend (événements transfer).
            lastPaymentFailure:
              type: object
              properties:
                code:
                  type: string
                message:
                  type: string
            failureCause:
              type: object
              properties:
                code:
                  type: string
                message:
                  type: string

  responses:
    WebhookAck:
      description: Accusé de réception (toujours renvoyé, corps vide).
      content:
        application/json:
          example: {}
    WebhookSignatureError:
      description: Signature invalide, header/corps manquant, ou webhook non configuré.
      content:
        application/json:
          examples:
            invalidSignature:
              value:
                error: "Invalid signature"
            notConfigured:
              value:
                error: "Webhook not configured"