paths:
  /api/admin/app-versions:
    get:
      operationId: adminListAppVersions
      summary: Lister les versions d'application
      description: Récupère la liste paginée de toutes les versions d'application enregistrées.
      tags:
        - Admin - Versions application
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Liste des versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      perPage:
                        type: integer
                      currentPage:
                        type: integer
                      lastPage:
                        type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppVersion'
              example:
                meta:
                  total: 5
                  perPage: 20
                  currentPage: 1
                  lastPage: 1
                data:
                  - id: 1
                    deviceType: "android"
                    versionNumber: "1.2.0"
                    minVersion: "1.0.0"
                    criticalUpdate: false
                    releaseDate: "2026-03-01"
                    downloadUrl: null
                    changelog: "Corrections de bugs et améliorations de performance"
                    createdAt: "2026-03-01T10:00:00Z"
                    updatedAt: "2026-03-01T10:00:00Z"
        '401':
          description: Non autorisé
    post:
      operationId: adminCreateAppVersion
      summary: Créer une version d'application
      description: Enregistre une nouvelle version d'application pour une plateforme donnée.
      tags:
        - Admin - Versions application
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppVersionRequest'
            example:
              deviceType: "android"
              versionNumber: "1.3.0"
              minVersion: "1.1.0"
              criticalUpdate: true
              releaseDate: "2026-03-15"
              downloadUrl: null
              changelog: "Mise à jour de sécurité critique"
      responses:
        '201':
          description: Version créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppVersion'
        '401':
          description: Non autorisé
        '422':
          description: Erreur de validation

  /api/admin/app-versions/{id}:
    get:
      operationId: adminGetAppVersion
      summary: Détails d'une version d'application
      tags:
        - Admin - Versions application
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant de la version
          schema:
            type: integer
      responses:
        '200':
          description: Détails de la version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppVersion'
        '401':
          description: Non autorisé
        '404':
          description: Version non trouvée
    put:
      operationId: adminUpdateAppVersion
      summary: Mettre à jour une version d'application
      tags:
        - Admin - Versions application
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant de la version
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppVersionRequest'
            example:
              criticalUpdate: false
              changelog: "Corrections de bugs mineurs"
      responses:
        '200':
          description: Version mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppVersion'
        '401':
          description: Non autorisé
        '404':
          description: Version non trouvée
        '422':
          description: Erreur de validation
    delete:
      operationId: adminDeleteAppVersion
      summary: Supprimer une version d'application
      tags:
        - Admin - Versions application
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant de la version
          schema:
            type: integer
      responses:
        '204':
          description: Version supprimée
        '401':
          description: Non autorisé
        '404':
          description: Version non trouvée

components:
  schemas:
    AppVersion:
      type: object
      properties:
        id:
          type: integer
        deviceType:
          type: string
          enum: [ios, android]
        versionNumber:
          type: string
          description: Numéro de la dernière version
        minVersion:
          type: string
          description: Version minimale supportée
        criticalUpdate:
          type: boolean
          description: Si true, force la mise à jour de l'application
        releaseDate:
          type: string
          description: Date de sortie
        downloadUrl:
          type: string
          nullable: true
          description: URL de téléchargement
        changelog:
          type: string
          nullable: true
          description: Notes de version
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAppVersionRequest:
      type: object
      required:
        - deviceType
        - versionNumber
        - minVersion
      properties:
        deviceType:
          type: string
          enum: [ios, android]
        versionNumber:
          type: string
        minVersion:
          type: string
        criticalUpdate:
          type: boolean
          default: false
        releaseDate:
          type: string
        downloadUrl:
          type: string
          nullable: true
        changelog:
          type: string
          nullable: true

    UpdateAppVersionRequest:
      type: object
      properties:
        deviceType:
          type: string
          enum: [ios, android]
        versionNumber:
          type: string
        minVersion:
          type: string
        criticalUpdate:
          type: boolean
        releaseDate:
          type: string
        downloadUrl:
          type: string
          nullable: true
        changelog:
          type: string
          nullable: true
