openapi: 3.0.3
info:
  title: Vérification d'entreprise (KYB)
  version: '1.0'

paths:
  /api/business/organisations/{organisationId}/kyb/pieces:
    post:
      tags: [Business - KYB]
      summary: Déposer une pièce au dossier de vérification
      description: >
        Une pièce par requête. L'entreprise dépose ce qu'elle a, quand elle l'a : le dossier reste en
        constitution tant qu'une pièce requise manque, et n'entre en revue qu'une fois complet.
        Réservé aux organisations de type entreprise.
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientChannelHeader'
        - $ref: '#/components/parameters/DeviceFingerprintHeader'
        - $ref: '#/components/parameters/DeviceUidHeader'
        - $ref: '#/components/parameters/OrganisationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [pieceType, reference, document]
              properties:
                pieceType:
                  type: string
                  enum: [RCCM, DFE]
                reference:
                  type: string
                  description: Numéro porté par la pièce. Sans lui, le dossier reste incomplet.
                  example: CI-ABJ-2020-B-12345
                document:
                  type: string
                  format: binary
      responses:
        '201':
          description: Pièce déposée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KybSubmission' }
        '400':
          $ref: '#/components/responses/ChannelRequired'
        '422':
          description: Pièce hors catalogue, référence vide, ou fichier hors format
        '403':
          description: Permission kyb:submit absente, ou organisation non entreprise

  /api/business/organisations/{organisationId}/kyb:
    get:
      tags: [Business - KYB]
      summary: Consulter l'état du dossier
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientChannelHeader'
        - $ref: '#/components/parameters/DeviceFingerprintHeader'
        - $ref: '#/components/parameters/DeviceUidHeader'
        - $ref: '#/components/parameters/OrganisationId'
      responses:
        '200':
          description: État du dossier
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KybFile' }
        '400':
          $ref: '#/components/responses/ChannelRequired'
        '403':
          description: Permission kyb:view absente, ou organisation non entreprise

components:
  schemas:
    KybSubmission:
      type: object
      properties:
        status:
          type: string
          enum: [in_submission, pending]
        nextAction:
          type: string
          description: Pièce attendue ensuite, ou IN_REVIEW quand le dossier est complet.
        missingPieces:
          type: array
          items: { type: string }

    KybFile:
      type: object
      properties:
        status:
          type: string
          nullable: true
          enum: [in_submission, pending, approved, rejected]
        nextAction:
          type: string
          nullable: true
        submittedPieces:
          type: array
          items:
            type: object
            properties:
              pieceType: { type: string }
              reference:
                type: string
                nullable: true
                description: >
                  Numéro porté par la pièce, quand elle en attend un. Une pièce sans référence
                  reste incomplète : elle figure alors aussi dans `missingPieces`.
        missingPieces:
          type: array
          items: { type: string }
